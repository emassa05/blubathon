[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "faro"
version = "0.2.0"
description = "Deterministic next-day dysregulation risk engine"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.116,<1",
    "joblib>=1.4,<2",
    "lightgbm>=4.7,<5",
    "mapie>=1.0,<2",
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "pyarrow>=18,<24",
    "pydantic>=2.10,<3",
    "scikit-learn>=1.6,<2",
    "scipy>=1.14,<2",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.12,<3",
    "import-linter>=2.3,<3",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["apps*", "ml*", "packages*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::RuntimeWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
