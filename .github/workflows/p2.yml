# Gate de P2 (TAREAS 11). Corre solo lo que P2 posee: API, store, seguridad,
# integración y frontend. El gate de P1 y el gate conjunto viven aparte.
name: p2

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: p2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API, store e integración
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # El gate de P2 se limita a su zona (CONVENTIONS 5). El gate conjunto,
      # que corre ruff y lint-imports sobre todo el repositorio, lo ejecutan
      # ambas personas antes del release.
      - name: Formato y lint de la zona P2
        run: |
          ruff check apps tools/seed tests/p2 tests/integration
          ruff format --check apps tools/seed tests/p2 tests/integration

      - name: Tests de P2 e integración
        run: pytest tests/p2 tests/integration -q

      - name: Siembra reproducible de la demo
        env:
          FARO_DB_PATH: ${{ runner.temp }}/faro-ci.db
        run: |
          python -m tools.seed --catalog blocked
          python -m tools.seed --catalog fixture-active

  frontend:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --dir apps/web lint

      - name: Typecheck
        run: pnpm --dir apps/web typecheck

      - name: Tests
        run: pnpm --dir apps/web test

      - name: Build
        run: pnpm --dir apps/web build
