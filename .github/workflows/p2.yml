# Gate del repositorio integrado. Desde que P1 y P2 viven en la misma rama, el
# gate corre las dos zonas y las tres comprobaciones que las unen: que el
# contrato generado no se editó a mano, que las capas siguen en pie, y que el
# camino real de los adaptadores existe.
name: p2

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: p2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API, store e integración
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # `generated/` y `examples/` se regeneran desde los modelos: si el diff no
      # sale vacío, alguien los editó a mano.
      - name: El contrato publicado no se tocó a mano
        run: |
          python -m tools.contracts.generate
          python -m tools.contracts.examples
          git diff --exit-code packages/shared/generated packages/shared/examples

      - name: Formato y lint
        run: |
          ruff check .
          ruff format --check .

      - name: Contratos de import
        run: lint-imports

      - name: Tests
        run: pytest tests -q

      - name: El camino real de los adaptadores existe
        env:
          FARO_P1_ADAPTERS: real
        run: pytest tests/integration -q

      - name: Siembra reproducible de la demo
        env:
          FARO_DB_PATH: ${{ runner.temp }}/faro-ci.db
        run: |
          python -m tools.seed --catalog blocked
          python -m tools.seed --catalog fixture-active
