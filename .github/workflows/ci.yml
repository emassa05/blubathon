# Gate del repositorio: backend Python (apps/api, ml, rag, packages/shared,
# tools) y la app móvil (Vue 3 + Vite). Corren en paralelo en cada push y PR.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (API, ML, RAG)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # packages/shared/generated y packages/shared/examples se regeneran
      # desde los modelos de packages/shared: si el diff no sale vacío,
      # alguien editó el contrato publicado a mano.
      - name: El contrato publicado no se tocó a mano
        run: |
          python -m tools.contracts.generate
          python -m tools.contracts.examples
          git diff --exit-code packages/shared/generated packages/shared/examples

      - name: Formato y lint
        run: |
          ruff check .
          ruff format --check .

      - name: Contratos de import entre capas
        run: lint-imports

      - name: Tests (adaptadores mock)
        run: pytest tests -q

      - name: Tests de integración (adaptadores reales)
        env:
          BLUBATHON_P1_ADAPTERS: real
        run: pytest tests/integration -q

      - name: Siembra reproducible de la demo
        env:
          BLUBATHON_DB_PATH: ${{ runner.temp }}/blubathon-ci.db
        run: |
          python -m tools.seed --catalog blocked
          python -m tools.seed --catalog fixture-active

  mobile:
    name: App móvil (apps/mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @faro/mobile lint

      - name: Tests
        run: pnpm --filter @faro/mobile test

      - name: Build (incluye chequeo de tipos)
        run: pnpm --filter @faro/mobile build
